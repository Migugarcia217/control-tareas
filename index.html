<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskTracker - Continuous Alarm</title>
  <!-- Icono para el navegador y pantalla de inicio en Android -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  
  <!-- Icono específico para iPhone (Apple Touch Icon) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">

  <!-- Enlace al archivo de configuración de la app (Web App Manifest) -->
  <link rel="manifest" href="manifest.json">

  <!-- Configuración para ver a pantalla completa en móviles -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskTracker">
  <meta name="theme-color" content="#1E293B">
  <style>
    :root {
      /* Fondo neutro intermedio (Slate / Charcoal Soft) */
      --bg-body: #1E293B;
      --bg-main: #1E293B;
      --bg-card: #334155;
      --bg-card-secondary: #0F172A;
      
      /* Colores Neón Vibrantes */
      --neon-green: #00FF66;
      --neon-green-glow: rgba(0, 255, 102, 0.35);
      
      --neon-cyan: #00E5FF;
      --neon-cyan-glow: rgba(0, 229, 255, 0.35);

      --neon-purple: #A855F7;
      --neon-purple-glow: rgba(168, 85, 247, 0.3);

      --neon-red: #FF2E63;
      --neon-red-glow: rgba(255, 46, 99, 0.4);

      /* Texto e Interfaz */
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-color: rgba(255, 255, 255, 0.12);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0F172A;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: var(--bg-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    /* Header UI */
    .header {
      padding: 24px 20px 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 15px var(--neon-cyan-glow);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #FFF;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .date-subheader {
      padding: 0 20px 16px 20px;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .main-content {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Quick Action Button */
    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      width: 100%;
      padding: 18px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      border: none;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-add-primary {
      background: linear-gradient(135deg, var(--neon-green), #00CC52);
      color: #052E16;
      box-shadow: 0 6px 20px var(--neon-green-glow);
    }

    /* Section Titles */
    .section-title {
      font-size: 14px;
      font-weight: 900;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 12px 4px 0 4px;
    }

    /* Task Cards */
    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .task-card.failed {
      border-color: var(--neon-red);
      box-shadow: 0 8px 20px var(--neon-red-glow);
    }

    .task-card.completed {
      border-color: var(--neon-green);
      box-shadow: 0 8px 20px var(--neon-green-glow);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-name {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .task-goal {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 700;
      margin-top: 4px;
    }

    .task-deadline {
      font-size: 13px;
      color: var(--neon-cyan);
      font-weight: 800;
      margin-top: 4px;
    }

    .status-badge {
      font-size: 13px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      margin-top: 8px;
    }

    .status-badge.failed {
      background: rgba(255, 46, 99, 0.2);
      color: var(--neon-red);
      border: 1px solid var(--neon-red);
    }

    .status-badge.completed {
      background: rgba(0, 255, 102, 0.2);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      animation: alertBlink 1s infinite alternate;
    }

    @keyframes alertBlink {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }

    .task-action-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 18px;
      padding: 8px;
      border-radius: 8px;
      transition: color 0.2s, background-color 0.2s;
    }

    .task-action-btn:hover {
      color: #FFF;
      background: rgba(255,255,255,0.1);
    }

    /* Battery Progress Bar */
    .battery-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .battery-shell {
      flex: 1;
      height: 28px;
      background: var(--bg-card-secondary);
      border: 2px solid #475569;
      border-radius: 10px;
      padding: 2px;
      position: relative;
    }

    .battery-shell::after {
      content: '';
      position: absolute;
      right: -7px;
      top: 7px;
      width: 4px;
      height: 10px;
      background: #475569;
      border-radius: 0 3px 3px 0;
    }

    .battery-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
      border-radius: 6px;
      width: 0%;
      transition: width 0.4s ease;
      box-shadow: 0 0 12px var(--neon-green-glow);
    }

    .battery-percent {
      font-size: 16px;
      font-weight: 900;
      min-width: 56px;
      text-align: right;
      color: var(--neon-green);
    }

    /* Timer Row */
    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card-secondary);
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .timer-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 24px;
      font-weight: 900;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan-glow);
      letter-spacing: 1px;
    }

    .btn-timer {
      background: var(--neon-green);
      color: #052E16;
      border: none;
      padding: 12px 22px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 0 12px var(--neon-green-glow);
      transition: transform 0.1s;
    }

    .btn-timer:active {
      transform: scale(0.95);
    }

    .btn-timer.active {
      background: var(--neon-red);
      color: #FFF;
      box-shadow: 0 0 12px var(--neon-red-glow);
    }

    .btn-timer:disabled {
      background: #475569;
      color: #94A3B8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .empty-history {
      text-align: center;
      padding: 24px;
      color: var(--text-sub);
      font-size: 14px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-color);
      font-weight: 700;
    }

    /* Modal Form */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--neon-cyan);
      width: 90%;
      max-width: 360px;
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-main);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 800;
      text-transform: uppercase;
    }

    .input-control {
      background: var(--bg-card-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 700;
      outline: none;
    }

    .input-control:focus {
      border-color: var(--neon-cyan);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .btn-modal {
      flex: 1;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-modal-cancel {
      background: var(--bg-card-secondary);
      color: var(--text-sub);
    }

    .btn-modal-save {
      background: var(--neon-cyan);
      color: #003344;
      box-shadow: 0 4px 12px var(--neon-cyan-glow);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand-group">
        <div class="brand-icon">⏱️</div>
        <div class="brand-name">CONTROL DE TAREAS</div>
      </div>
    </header>
    
    <div class="date-subheader" id="current-date">VIERNES, 2 DE OCTUBRE DE 2026</div>

    <main class="main-content">
      <!-- Quick Action Button -->
      <div class="top-actions">
        <button class="btn-action btn-add-primary" id="open-modal-btn">
          ➕ AGREGAR NUEVA TAREA
        </button>
      </div>

      <!-- Active Tasks Section -->
      <div class="section-title">Mis Metas Activas</div>
      <div id="tasks-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </main>
  </div>

  <!-- Modal for Creating/Editing Task -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title-text">Nueva Meta con Fecha Límite</div>
      
      <div class="input-group">
        <label for="task-name-input">Nombre de la tarea</label>
        <input type="text" id="task-name-input" class="input-control" placeholder="Ej. Estudiar Programación">
      </div>

      <div class="input-group">
        <label for="task-hours-input">Meta de horas totales</label>
        <input type="number" id="task-hours-input" class="input-control" placeholder="Ej. 10" min="1">
      </div>

      <div class="input-group">
        <label for="task-date-input">Fecha límite</label>
        <input type="date" id="task-date-input" class="input-control">
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-modal-cancel" id="close-modal-btn">Cancelar</button>
        <button class="btn-modal btn-modal-save" id="save-task-btn">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // App State
    let tasks = JSON.parse(localStorage.getItem('moneta_tasks_v10')) || [
      { id: 1, name: 'Estudiar Programación', goalHours: 5, loggedSeconds: 3600, deadline: '2026-10-10', active: false, startTime: null }
    ];

    let editingTaskId = null;
    let alarmInterval = null; // Control para la alarma continua

    // Elements
    const tasksContainer = document.getElementById('tasks-container');
    const taskModal = document.getElementById('task-modal');
    const modalTitleText = document.getElementById('modal-title-text');
    const openModalBtn = document.getElementById('open-modal-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveTaskBtn = document.getElementById('save-task-btn');
    const taskNameInput = document.getElementById('task-name-input');
    const taskHoursInput = document.getElementById('task-hours-input');
    const taskDateInput = document.getElementById('task-date-input');
    const currentDateEl = document.getElementById('current-date');

    if (window.Notification && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function updateDateDisplay() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const today = new Date();
      currentDateEl.textContent = today.toLocaleDateString('es-ES', options).toUpperCase();
    }

    function saveState() {
      localStorage.setItem('moneta_tasks_v10', JSON.stringify(tasks));
    }

    // Iniciar Alarma Continua en Bucle (Suena sin parar hasta que se interactúe)
    function startContinuousAlarm(taskName) {
      if (alarmInterval) return; // Ya está sonando

      if (navigator.vibrate) {
        navigator.vibrate([1000, 500, 1000, 500, 1000]);
      }

      if (window.Notification && Notification.permission === "granted") {
        try {
          new Notification("¡Meta Cumplida! 🎉", {
            body: `¡Felicidades Óscar! Completaste "${taskName}". Entra a la app para detener la alarma.`,
            icon: "icon-192.png",
            requireInteraction: true
          });
        } catch (e) {}
      }

      // Función que reproduce un tono largo y se repite cada 3 segundos
      const playBeepPattern = () => {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sine';
          osc.frequency.value = 850;
          
          gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.0); // Tono de 2 segundos
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start();
          osc.stop(audioCtx.currentTime + 2.0);
        } catch (e) {}
      };

      playBeepPattern(); // Sonar inmediatamente
      alarmInterval = setInterval(playBeepPattern, 3000); // Repetir cada 3 segundos indefinidamente
    }

    // Detener la alarma continua cuando el usuario interactúe
    function stopContinuousAlarm() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    function getTaskCurrentSeconds(task) {
      if (task.active && task.startTime) {
        const secondsSinceStart = Math.floor((Date.now() - task.startTime) / 1000);
        return task.loggedSeconds + secondsSinceStart;
      }
      return task.loggedSeconds;
    }

    function checkDeadlines() {
      const todayStr = new Date().toISOString().split('T')[0];

      tasks.forEach(task => {
        const currentSecs = getTaskCurrentSeconds(task);
        if (task.deadline <= todayStr && !task.status) {
          if (task.active) {
            task.active = false;
            task.loggedSeconds = currentSecs;
            task.startTime = null;
          }

          const goalSeconds = task.goalHours * 3600;
          if (task.loggedSeconds >= goalSeconds) {
            task.status = 'completed';
          } else {
            task.status = 'failed';
          }
        }
      });
    }

    function render() {
      checkDeadlines();
      tasksContainer.innerHTML = '';

      if (tasks.length === 0) {
        tasksContainer.innerHTML = `<div class="empty-history">No tienes metas activas. ¡Agrega una para comenzar!</div>`;
        return;
      }

      // Si alguna tarea está completada y activa la alarma, asegurarnos de que suene
      const hasCompletedActive = tasks.some(t => t.status === 'completed');
      if (hasCompletedActive && !alarmInterval) {
        const completedTask = tasks.find(t => t.status === 'completed');
        startContinuousAlarm(completedTask.name);
      }

      tasks.forEach(task => {
        const goalSeconds = task.goalHours * 3600;
        const currentSecs = getTaskCurrentSeconds(task);
        const percent = Math.min(100, Math.round((currentSecs / goalSeconds) * 100));
        const hoursLogged = (currentSecs / 3600).toFixed(1);

        let cardClass = 'task-card';
        let statusHTML = '';
        let timerDisabled = '';

        if (task.status === 'failed') {
          cardClass += ' failed';
          statusHTML = `<div class="status-badge failed">❌ Fallaste</div>`;
          timerDisabled = 'disabled';
        } else if (task.status === 'completed') {
          cardClass += ' completed';
          statusHTML = `<div class="status-badge completed">🎉 Cumpliste</div>`;
          timerDisabled = 'disabled';
        }

        const card = document.createElement('div');
        card.className = cardClass;
        card.innerHTML = `
          <div class="task-header">
            <div>
              <div class="task-name">${task.name}</div>
              <div class="task-goal" id="goal-${task.id}">${hoursLogged} / ${task.goalHours} hrs acumuladas</div>
              <div class="task-deadline">📅 Límite: ${task.deadline}</div>
              ${statusHTML}
            </div>
            <div class="task-actions-group">
              <button class="task-action-btn" onclick="openEditModal(${task.id})" title="Editar Tarea">✏️</button>
              <button class="task-action-btn" onclick="deleteTask(${task.id})" title="Eliminar Tarea">🗑️</button>
            </div>
          </div>

          <div class="battery-container">
            <div class="battery-shell">
              <div class="battery-fill" id="fill-${task.id}" style="width: ${percent}%;"></div>
            </div>
            <div class="battery-percent" id="percent-${task.id}">${percent}%</div>
          </div>

          <div class="timer-row">
            <div class="timer-display" id="timer-${task.id}">
              ${formatTime(currentSecs)}
            </div>
            <button class="btn-timer ${task.active ? 'active' : ''}" ${timerDisabled} onclick="toggleTimer(${task.id})">
              ${task.status === 'completed' ? 'TERMINADA' : (task.active ? 'PAUSAR' : 'INICIAR')}
            </button>
          </div>
        `;
        tasksContainer.appendChild(card);
      });
    }

    function formatTime(totalSeconds) {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    window.toggleTimer = function(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      // Si la tarea ya se completó y sonaba la alarma, al hacer clic se detiene la alarma
      if (task.status === 'completed') {
        stopContinuousAlarm();
        saveState();
        render();
        return;
      }

      if (task.status) return;

      if (task.active) {
        task.loggedSeconds = getTaskCurrentSeconds(task);
        task.active = false;
        task.startTime = null;
      } else {
        tasks.forEach(t => {
          if (t.active) {
            t.loggedSeconds = getTaskCurrentSeconds(t);
            t.active = false;
            t.startTime = null;
          }
        });

        task.active = true;
        task.startTime = Date.now();
      }
      saveState();
      render();
    };

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        checkGoalCompletionOnSync();
        saveState();
        render();
      }
    });

    window.addEventListener("pageshow", () => {
      checkGoalCompletionOnSync();
      saveState();
      render();
    });

    function checkGoalCompletionOnSync() {
      let updated = false;
      tasks.forEach(task => {
        if (task.active) {
          const currentSecs = getTaskCurrentSeconds(task);
          const goalSeconds = task.goalHours * 3600;

          if (currentSecs >= goalSeconds) {
            task.loggedSeconds = goalSeconds;
            task.active = false;
            task.startTime = null;
            task.status = 'completed';
            startContinuousAlarm(task.name);
            updated = true;
          }
        }
      });
      if (updated) {
        saveState();
      }
    }

    setInterval(() => {
      let needsSave = false;
      tasks.forEach(task => {
        if (task.active) {
          const currentSecs = getTaskCurrentSeconds(task);
          const goalSeconds = task.goalHours * 3600;

          if (currentSecs >= goalSeconds) {
            task.loggedSeconds = goalSeconds;
            task.active = false;
            task.startTime = null;
            task.status = 'completed';
            startContinuousAlarm(task.name);
            needsSave = true;
          }

          const timerEl = document.getElementById(`timer-${task.id}`);
          const fillEl = document.getElementById(`fill-${task.id}`);
          const percentEl = document.getElementById(`percent-${task.id}`);
          const goalEl = document.getElementById(`goal-${task.id}`);

          if (timerEl) timerEl.textContent = formatTime(currentSecs);
          if (fillEl && percentEl && goalEl) {
            const p = Math.min(100, Math.round((currentSecs / goalSeconds) * 100));
            fillEl.style.width = `${p}%`;
            percentEl.textContent = `${p}%`;
            goalEl.textContent = `${(currentSecs / 3600).toFixed(1)} / ${task.goalHours} hrs acumuladas`;
          }
        }
      });

      if (needsSave) {
        saveState();
        render();
      }
    }, 1000);

    window.openEditModal = function(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      editingTaskId = id;
      modalTitleText.textContent = 'Editar Meta';
      taskNameInput.value = task.name;
      taskHoursInput.value = task.goalHours;
      taskDateInput.value = task.deadline;
      taskModal.classList.add('open');
    };

    window.deleteTask = function(id) {
      if (confirm('¿Deseas eliminar esta tarea?')) {
        stopContinuousAlarm();
        tasks = tasks.filter(t => t.id !== id);
        saveState();
        render();
      }
    };

    openModalBtn.onclick = () => {
      editingTaskId = null;
      modalTitleText.textContent = 'Nueva Meta con Fecha Límite';
      taskNameInput.value = '';
      taskHoursInput.value = '';
      taskDateInput.value = '';
      taskModal.classList.add('open');
    };

    closeModalBtn.onclick = () => taskModal.classList.remove('open');

    saveTaskBtn.onclick = () => {
      const name = taskNameInput.value.trim();
      const hours = parseFloat(taskHoursInput.value);
      const deadline = taskDateInput.value;

      if (!name || isNaN(hours) || hours <= 0 || !deadline) {
        alert('Por favor completa todos los campos con valores válidos (incluyendo la fecha).');
        return;
      }

      if (editingTaskId !== null) {
        const task = tasks.find(t => t.id === editingTaskId);
        if (task) {
          task.name = name;
          task.goalHours = hours;
          task.deadline = deadline;
          task.status = undefined; 
        }
      } else {
        tasks.push({
          id: Date.now(),
          name,
          goalHours: hours,
          loggedSeconds: 0,
          deadline,
          active: false,
          startTime: null,
          status: undefined
        });
      }

      taskNameInput.value = '';
      taskHoursInput.value = '';
      taskDateInput.value = '';
      editingTaskId = null;
      taskModal.classList.remove('open');
      saveState();
      render();
    };

    updateDateDisplay();
    render();
  </script>
</body>
</html>
